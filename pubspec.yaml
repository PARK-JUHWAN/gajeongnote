name: gajeongnote
description: 가정간호노트 — 제도와 근거를 두 가지 언어로 읽는 학습 앱
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.0
  flutter_svg: ^2.0.0
  hive_ce: ^2.0.0
  hive_ce_flutter: ^2.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true

  assets:
    - assets/content.json
    - fonts/PRETENDARD-LICENSE.txt

  fonts:
    - family: Pretendard
      fonts:
        - asset: fonts/Pretendard-Regular.otf
          weight: 400
        - asset: fonts/Pretendard-Medium.otf
          weight: 500
        - asset: fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: fonts/Pretendard-Bold.otf
          weight: 700
        - asset: fonts/Pretendard-ExtraBold.otf
          weight: 800

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"

  android: "ic_launcher"
  adaptive_icon_background: "#00857A"
  adaptive_icon_foreground: "assets/icon/icon.png"
  min_sdk_android: 21

  ios: true
  remove_alpha_ios: true